<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barcode Calculator Scale</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .calculator {
      width: 100%;
      max-width: 400px;
      background: #2c3e50;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    #display {
      background: #ecf0f1;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
      text-align: center;
      font-family: monospace;
      font-size: 1em;
    }

    .display-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .display-item {
      text-align: center;
      flex: 1;
    }

    .display-label {
      font-size: 0.8em;
      color: #7f8c8d;
    }

    .display-value {
      font-size: 1.1em;
      font-weight: bold;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .function-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .small-function-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    button {
      padding: 15px 10px;
      border: none;
      background: #3498db;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      min-height: 50px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s;
    }

    button:active {
      background: #2980b9;
      transform: scale(0.98);
    }

    .function-btn {
      background: #e67e22;
    }

    .function-btn:active {
      background: #d35400;
    }

    #barcode {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background: white;
      border-radius: 5px;
    }

    #status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      color: white;
      font-size: 14px;
    }

    .status-connected {
      background-color: #27ae60;
    }

    .status-disconnected {
      background-color: #c0392b;
    }

    #notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px;
      border-radius: 5px;
      display: none;
      color: white;
      background-color: #2c3e50;
      max-width: 90%;
      text-align: center;
      z-index: 1000;
    }

    .print-btn {
      grid-column: span 3;
      background: #e74c3c !important;
    }

    .print-btn:active {
      background: #c0392b !important;
    }

    .backspace-btn {
      background: #c0392b;
    }

    .backspace-btn:active {
      background: #a93226;
    }

    .active-mode {
      background: #27ae60 !important;
    }

    .small-btn {
      padding: 10px 5px;
      font-size: 14px;
      min-height: 40px;
    }
    
    /* Audio status indicator */
    .audio-status {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #4CAF50;
      color: white;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    .audio-status.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="audio-status" id="audio-status">Audio: Memuat...</div>
  
  <div class="calculator">
    <div id="display">
      <div class="display-row">
        <div class="display-item">
          <div class="display-label">FLEX</div>
          <div class="display-value" id="current-flex">00</div>
        </div>
        <div class="display-item">
          <div class="display-label">KATEGORI</div>
          <div class="display-value" id="current-category">000</div>
        </div>
      </div>
      <div class="display-row">
        <div class="display-item">
          <div class="display-label">PRODUK</div>
          <div class="display-value" id="current-product">000</div>
        </div>
        <div class="display-item">
          <div class="display-label">BERAT</div>
          <div class="display-value" id="current-weight">00000</div>
        </div>
      </div>
      <div class="display-row">
        <div class="display-item" style="flex: 2;">
          <div class="display-label">BARCODE</div>
          <div class="display-value" id="current-barcode">0000000000000</div>
        </div>
      </div>
    </div>
    
    <div class="small-function-row">
      <button id="flex-btn" class="function-btn small-btn active-mode" onclick="setInputMode('flex'); playSound('mode')">FLEX</button>
      <button id="category-btn" class="function-btn small-btn" onclick="setInputMode('category'); playSound('mode')">KATEGORI</button>
    </div>
    
    <div class="function-row">
      <button id="product-btn" class="function-btn" onclick="setInputMode('product'); playSound('mode')">PRODUK</button>
      <button id="weight-btn" class="function-btn" onclick="setInputMode('weight'); playSound('mode')">BERAT</button>
      <button class="backspace-btn" onclick="backspace(); playSound('delete')">⌫</button>
    </div>
    
    <div class="function-row">
      <button class="function-btn" onclick="clearInput(); playSound('delete')">CLEAR</button>
      <button class="function-btn" onclick="generate(); playSound('function')">ENTER</button>
      <button class="function-btn" onclick="connectToPrinter(); playSound('connect')">CONNECT</button>
    </div>
    
    <div class="buttons">
      <button onclick="appendNumber('7'); playSound('number')">7</button>
      <button onclick="appendNumber('8'); playSound('number')">8</button>
      <button onclick="appendNumber('9'); playSound('number')">9</button>
      
      <button onclick="appendNumber('4'); playSound('number')">4</button>
      <button onclick="appendNumber('5'); playSound('number')">5</button>
      <button onclick="appendNumber('6'); playSound('number')">6</button>
      
      <button onclick="appendNumber('1'); playSound('number')">1</button>
      <button onclick="appendNumber('2'); playSound('number')">2</button>
      <button onclick="appendNumber('3'); playSound('number')">3</button>
      
      <button onclick="appendNumber('0'); playSound('number')">0</button>
      <button onclick="appendNumber('00'); playSound('number')">00</button>
      
      <button class="print-btn function-btn" onclick="printBarcode(); playSound('print')">PRINT</button>
    </div>
    
    <svg id="barcode"></svg>
    <div id="status" class="status-disconnected">Printer: Tidak Terkoneksi</div>
  </div>
  <div id="notification"></div>

  <script>
    // Audio system
    let audioContext = null;
    let isAudioInitialized = false;
    const audioStatus = document.getElementById('audio-status');
    
    // Initialize audio
    function initAudio() {
      try {
        if (window.AudioContext || window.webkitAudioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          
          // Create a simple test tone to verify audio works
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          gainNode.gain.value = 0.001; // Very quiet test
          oscillator.frequency.value = 440;
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.01);
          
          isAudioInitialized = true;
          audioStatus.textContent = "Audio: Siap";
          setTimeout(() => {
            audioStatus.classList.remove('show');
          }, 2000);
          
          console.log("Audio initialized successfully");
        } else {
          audioStatus.textContent = "Audio: Tidak didukung";
          setTimeout(() => {
            audioStatus.classList.remove('show');
          }, 2000);
        }
      } catch (error) {
        console.log("Audio initialization error:", error);
        audioStatus.textContent = "Audio: Error";
        setTimeout(() => {
          audioStatus.classList.remove('show');
        }, 2000);
      }
    }
    
    // Show audio status
    audioStatus.classList.add('show');
    
    // Play sound function
    function playSound(type = 'number', frequency = 600, duration = 0.1, volume = 0.2) {
      if (!isAudioInitialized) {
        initAudio();
        if (!isAudioInitialized) return;
      }
      
      try {
        // Resume audio context if suspended
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
        
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        // Set parameters based on sound type
        switch(type) {
          case 'number':
            frequency = 600 + Math.random() * 100;
            volume = 0.15;
            break;
          case 'delete':
            frequency = 350;
            volume = 0.2;
            duration = 0.08;
            break;
          case 'mode':
            frequency = 700;
            volume = 0.18;
            break;
          case 'function':
            frequency = 900;
            volume = 0.18;
            duration = 0.12;
            break;
          case 'print':
            frequency = 1100;
            duration = 0.15;
            volume = 0.22;
            break;
          case 'connect':
            frequency = 800;
            duration = 0.18;
            volume = 0.2;
            break;
          case 'success':
            frequency = 1000;
            duration = 0.25;
            volume = 0.25;
            break;
          case 'error':
            frequency = 300;
            duration = 0.15;
            volume = 0.25;
            break;
          case 'notification':
            frequency = 1200;
            duration = 0.15;
            volume = 0.2;
            break;
        }
        
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        
        // Set envelope for smooth sound
        const now = audioContext.currentTime;
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(volume, now + 0.01);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
        
        oscillator.start(now);
        oscillator.stop(now + duration);
        
        // Cleanup
        oscillator.onended = () => {
          oscillator.disconnect();
          gainNode.disconnect();
        };
      } catch (error) {
        console.log("Sound error:", error);
      }
    }
    
    // Play click sound
    function playClickSound() {
      playSound('number');
    }

    // Global variables
    let currentInputMode = 'flex';
    let flexValue = '';
    let categoryValue = '';
    let productValue = '';
    let weightValue = '';
    let port = null;
    let writer = null;
    
    // Initialize audio on first user interaction
    document.addEventListener('click', function initAudioOnInteraction() {
      if (!isAudioInitialized) {
        initAudio();
      }
      document.removeEventListener('click', initAudioOnInteraction);
    }, { once: true });
    
    // Input handling functions
    function setInputMode(mode) {
      currentInputMode = mode;
      // Update visual indicator
      document.getElementById('flex-btn').classList.toggle('active-mode', mode === 'flex');
      document.getElementById('category-btn').classList.toggle('active-mode', mode === 'category');
      document.getElementById('product-btn').classList.toggle('active-mode', mode === 'product');
      document.getElementById('weight-btn').classList.toggle('active-mode', mode === 'weight');
    }
    
    function appendNumber(num) {
      if (currentInputMode === 'flex') {
        if (num === '00') {
          if (flexValue.length === 0) {
            flexValue = '00';
          }
        } else if (flexValue.length < 2) {
          flexValue += num;
        }
      } else if (currentInputMode === 'category') {
        if (num === '00') {
          if (categoryValue.length <= 1) {
            categoryValue += '00';
          }
        } else if (categoryValue.length < 3) {
          categoryValue += num;
        }
      } else if (currentInputMode === 'product') {
        if (num === '00') {
          if (productValue.length <= 1) {
            productValue += '00';
          }
        } else if (productValue.length < 3) {
          productValue += num;
        }
      } else if (currentInputMode === 'weight') {
        if (num === '00') {
          if (weightValue.length <= 3) {
            weightValue += '00';
          }
        } else if (weightValue.length < 5) {
          weightValue += num;
        }
      }
      updateDisplay();
    }
    
    function backspace() {
      if (currentInputMode === 'flex' && flexValue.length > 0) {
        flexValue = flexValue.slice(0, -1);
      } else if (currentInputMode === 'category' && categoryValue.length > 0) {
        categoryValue = categoryValue.slice(0, -1);
      } else if (currentInputMode === 'product' && productValue.length > 0) {
        productValue = productValue.slice(0, -1);
      } else if (currentInputMode === 'weight' && weightValue.length > 0) {
        weightValue = weightValue.slice(0, -1);
      }
      updateDisplay();
    }
    
    function clearInput() {
      productValue = '';
      weightValue = '';
      updateDisplay();
      JsBarcode("#barcode", "", { displayValue: false });
      showNotification('Kode produk dan berat telah direset');
    }
    
    // Display and formatting functions
    function formatBarcodeData() {
      const formattedFlex = flexValue.padStart(2, '0');
      const formattedCategory = categoryValue.padStart(3, '0');
      const formattedProduct = productValue.padStart(3, '0');
      const formattedWeight = weightValue.padStart(5, '0');
      return `${formattedFlex}${formattedCategory}${formattedProduct}${formattedWeight}`;
    }
    
    // Function to format values without leading zeros for display
    function formatDisplayValue(value, defaultValue = '0') {
      if (!value || value === '') return defaultValue;
      // Remove leading zeros
      return value.replace(/^0+/, '') || '0';
    }
    
    function updateDisplay() {
      document.getElementById('current-flex').textContent = flexValue.padStart(2, '0');
      document.getElementById('current-category').textContent = categoryValue.padStart(3, '0');
      document.getElementById('current-product').textContent = productValue.padStart(3, '0');
      document.getElementById('current-weight').textContent = weightValue.padStart(5, '0');
      document.getElementById('current-barcode').textContent = formatBarcodeData();
    }
    
    function generate() {
      const barcodeData = formatBarcodeData();
      if (barcodeData.length !== 13) {
        playSound('error');
        showNotification('Pastikan semua field terisi dengan digit yang benar');
        return;
      }
      
      JsBarcode("#barcode", barcodeData, {
        format: "CODE128",
        displayValue: true,
        fontSize: 16,
        height: 50,
        margin: 10
      });
      
      playSound('success');
      showNotification('Barcode berhasil digenerate');
    }
    
    // Printer communication functions - Web Serial API
    async function connectToPrinter() {
      try {
        if (!("serial" in navigator)) {
          playSound('error');
          showNotification("Browser tidak mendukung Web Serial API. Gunakan Chrome/Edge.");
          return false;
        }

        showNotification("Memilih printer...");
        
        // Request serial port
        port = await navigator.serial.requestPort();
        showNotification("Membuka koneksi...");
        
        // Open the port with baud rate 9600 (standard for many thermal printers)
        await port.open({ baudRate: 9600 });
        
        // Get the writer
        writer = port.writable.getWriter();
        
        updateConnectionStatus(true);
        playSound('success');
        showNotification('Printer berhasil terhubung!');
        return true;
        
      } catch (error) {
        console.error("Connection error:", error);
        if (error.name === 'NotFoundError') {
          playSound('error');
          showNotification("Tidak ada printer yang dipilih");
        } else {
          playSound('error');
          showNotification("Gagal terhubung ke printer: " + error.message);
        }
        updateConnectionStatus(false);
        return false;
      }
    }
    
    async function printBarcode() {
      try {
        if (!productValue || !weightValue) {
          playSound('error');
          showNotification('Harap isi PRODUK dan BERAT terlebih dahulu');
          return;
        }
        
        // Generate barcode if not already generated
        const barcodeData = formatBarcodeData();
        if (barcodeData.length !== 13) {
          playSound('error');
          showNotification('Pastikan semua field terisi dengan digit yang benar');
          return;
        }
        
        // Auto-generate barcode if not already done
        if (!document.querySelector('#barcode text') || 
            document.querySelector('#barcode text').textContent !== barcodeData) {
          generate();
        }

        if (!writer) {
          playSound('error');
          showNotification('Printer belum terhubung. Klik tombol CONNECT dulu.');
          return;
        }

        showNotification("Mengirim data ke printer...");
        
        // ESC/POS commands
        const esc = '\x1B';
        const gs = '\x1D';
        const lf = '\x0A';
        
        // Initialize printer
        let data = esc + '@';
        
        // Set alignment to center for all content
        data += esc + 'a' + '\x01'; // Center alignment
        
        // Baris 1: [Flex value][kategori value][produk value][berat value]
        // Format: [FF][KKK][PPP][WWWWW]
        data += '[' + flexValue.padStart(2, '0') + '][' + 
                       categoryValue.padStart(3, '0') + '][' + 
                       productValue.padStart(3, '0') + '][' + 
                       weightValue.padStart(5, '0') + ']' + lf;
        
        // Baris kosong
        data += lf;
        
        // Set alignment to center for barcode
        data += esc + 'a' + '\x01'; // Center alignment again for barcode
        
        // Print barcode using ESC/POS native barcode commands
        // Select barcode height
        data += gs + 'h' + '\x50'; // Height = 80
        // Select barcode width
        data += gs + 'w' + '\x02'; // Width = 2
        // Select CODE128 barcode
        data += gs + 'k' + '\x49'; // CODE128
        // Length of data
        data += String.fromCharCode(barcodeData.length);
        // Barcode data
        data += barcodeData;
        
        // Tambahkan feed untuk memastikan barcode tercetak
        data += lf;
        
        // Dua baris kosong setelah barcode
        data += lf + lf;
        
        // Add cut command (full cut)
        data += gs + 'V' + '\x41' + '\x00';
        
        // Encode and send data
        const encoder = new TextEncoder();
        const encodedData = encoder.encode(data);
        
        await writer.write(encodedData);
        
        playSound('success');
        showNotification('Data berhasil dikirim ke printer');
      } catch (error) {
        console.error("Print error:", error);
        playSound('error');
        showNotification("Gagal mengirim ke printer: " + error.message);
        
        // Coba format alternatif jika gagal
        if (error.message.includes("invalid") || error.message.includes("character")) {
          showNotification("Mencoba format alternatif...");
          await tryAlternativePrint();
        }
      }
    }
    
    // Alternatif format cetak
    async function tryAlternativePrint() {
      try {
        const barcodeData = formatBarcodeData();
        
        // ESC/POS commands
        const esc = '\x1B';
        const gs = '\x1D';
        const lf = '\x0A';
        
        // Initialize printer
        let data = esc + '@';
        
        // Set alignment to center
        data += esc + 'a' + '\x01'; // Center alignment
        
        // Baris 1: [Flex value][kategori value][produk value][berat value]
        data += '[' + flexValue.padStart(2, '0') + '][' + 
                       categoryValue.padStart(3, '0') + '][' + 
                       productValue.padStart(3, '0') + '][' + 
                       weightValue.padStart(5, '0') + ']' + lf;
        
        // Baris kosong
        //data += lf;
        
        // Set alignment to center untuk barcode
        data += esc + 'a' + '\x01'; // Center alignment
        
        // Alternatif perintah barcode
        // Set barcode height
        data += gs + 'h' + '\x50'; // Height = 80
        // Set barcode width
        data += gs + 'w' + '\x02'; // Width = 2
        // CODE128 barcode
        data += gs + 'k' + '\x49'; // GS k 73 (CODE128)
        data += barcodeData.length; // Length
        data += barcodeData; // Data
        
        // Feed lines
        data += lf;
        
        // Dua baris kosong
        data += lf + lf;
        
        // Cut paper
        data += gs + 'V' + '\x41' + '\x00'; // Full cut
        
        const encoder = new TextEncoder();
        const encodedData = encoder.encode(data);
        
        await writer.write(encodedData);
        
        playSound('success');
        showNotification('Berhasil dicetak dengan format alternatif!');
      } catch (error2) {
        console.error("Alternative print error:", error2);
        playSound('error');
        showNotification("Gagal mencetak dengan format alternatif");
      }
    }
    
    // UI feedback functions
    function updateConnectionStatus(connected) {
      const status = document.getElementById('status');
      if (connected) {
        status.textContent = 'Printer: Terkoneksi';
        status.className = 'status-connected';
      } else {
        status.textContent = 'Printer: Tidak Terkoneksi';
        status.className = 'status-disconnected';
      }
    }
    
    function showNotification(message, duration = 3000) {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.style.display = 'block';
      
      // Play notification sound
      playSound('notification');
      
      setTimeout(() => {
        notification.style.display = 'none';
      }, duration);
    }
    
    // Keyboard support
    document.addEventListener('keydown', function(event) {
      const key = event.key;
      
      // Play sound for any key press
      if (key >= '0' && key <= '9') {
        playSound('number');
      } else if (key === 'Backspace') {
        playSound('delete');
      } else if (key === 'Enter') {
        playSound('function');
      } else if (key === 'c' || key === 'C') {
        if (event.ctrlKey) return;
        playSound('connect');
      } else if (key === 'p' || key === 'P') {
        playSound('print');
      }
      
      // Numbers
      if (key >= '0' && key <= '9') {
        appendNumber(key);
      }
      
      // Special keys
      switch(key) {
        case 'Backspace':
          backspace();
          break;
        case 'Delete':
          clearInput();
          break;
        case 'Enter':
          generate();
          break;
        case 'c':
        case 'C':
          if (event.ctrlKey) break;
          connectToPrinter();
          break;
        case 'p':
        case 'P':
          printBarcode();
          break;
        case '1':
        case '2':
        case '3':
        case '4':
          // Mode switching with number keys
          if (event.ctrlKey) {
            event.preventDefault();
            const modes = ['flex', 'category', 'product', 'weight'];
            const modeIndex = parseInt(key) - 1;
            if (modeIndex < modes.length) {
              setInputMode(modes[modeIndex]);
            }
          }
          break;
      }
    });
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      updateDisplay();
      
      // Check Web Serial API support
      if (!("serial" in navigator)) {
        document.getElementById('status').textContent = 'Browser tidak mendukung Web Serial API';
      }
    });
  </script>
</body>
</html>
